<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===========================================================================
       BALISES DE PARTAGE — elles restent écrites en dur ici, et c'est voulu :
       les robots de Facebook, Instagram, WhatsApp, iMessage, X et Discord ne
       lancent pas le JavaScript. Une balise injectée depuis links.js serait
       invisible pour eux et l'aperçu du lien partagé sortirait vide — soit
       exactement le cas qui compte quand ce lien est dans une bio Instagram.

       Si tu branches un domaine perso, remplace https://4restdump.vercel.app
       partout ci-dessous (canonical, og:url, et les URL d'images).
       ======================================================================== -->
  <title>Forrest The Dump — monteur vidéo & développeur</title>
  <meta name="description" content="Montage de clips et de formats courts, et mes apps iOS. Tous mes liens au même endroit.">

  <link rel="canonical" href="https://4restdump.vercel.app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Forrest The Dump">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://4restdump.vercel.app/">
  <meta property="og:title" content="Forrest The Dump — monteur vidéo & développeur">
  <meta property="og:description" content="Montage de clips et de formats courts, et mes apps iOS. Tous mes liens au même endroit.">
  <!-- L'URL doit rester absolue : les robots ne résolvent pas les chemins relatifs. -->
  <meta property="og:image" content="https://4restdump.vercel.app/assets/og-image.png">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="315">
  <meta property="og:image:alt" content="Forrest The Dump — monteur vidéo et développeur">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Forrest The Dump — monteur vidéo & développeur">
  <meta name="twitter:description" content="Montage de clips et de formats courts, et mes apps iOS. Tous mes liens au même endroit.">
  <meta name="twitter:image" content="https://4restdump.vercel.app/assets/og-image.png">

  <meta name="theme-color" content="#dceeff">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Les deux seules ressources externes du site : la police d'affichage et
       la police d'interface. preconnect ouvre la connexion pendant que le HTML
       finit de se parser, sinon le texte clignote au premier affichage. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>

<!-- data-page indique à links.js quelle page rendre. Ne pas modifier. -->
<body data-page="hub">

  <a class="skip" href="#main">Aller au contenu</a>

  <noscript>
    <p class="noscript">Ce site a besoin de JavaScript pour afficher ses liens.</p>
  </noscript>

  <!-- Emplacements vides : tout le contenu vient de links.js. -->
  <div id="marquee"></div>
  <header id="nav"></header>

  <main id="main">
    <section id="hero"></section>
    <section id="featured"></section>
    <section id="projects" aria-labelledby="projets"></section>
  </main>

  <footer id="footer"></footer>

  <script src="links.js" defer></script>
</body>
</html>
